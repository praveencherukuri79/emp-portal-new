<div class="user-management">
  <div class="page-header">
    <div>
      <h1>User Management</h1>
      <p class="subtitle">Manage system users</p>
    </div>
    <button mat-raised-button color="primary" (click)="openCreateUserDialog()">
      <mat-icon>person_add</mat-icon>
      Add User
    </button>
  </div>

  <div class="filters-section">
    <mat-card>
      <mat-card-content>
        <div class="filters-row">
          <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search users</mat-label>
            <input matInput 
                   [ngModel]="searchQuery()" 
                   (ngModelChange)="searchQuery.set($event)">
            <mat-icon matPrefix>search</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="role-filter">
            <mat-label>Filter by Role</mat-label>
            <mat-select [ngModel]="roleFilter()" (ngModelChange)="onRoleFilterChange($event)">
              <mat-option value="">All Roles</mat-option>
              <mat-option *ngFor="let role of roles" [value]="role">
                {{ getRoleLabel(role) }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <mat-icon>people</mat-icon>
        Users ({{ filteredUsersData().length }})
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-user-table
        [columns]="tableColumns"
        [dataSource]="filteredUsersData()"
        [loading]="loading()"
        [emptyMessage]="'No users found. Try adjusting your search or filters.'"
        (view)="onViewUser($event)"
        (edit)="onEditUser($event)"
        (statusToggle)="onStatusToggle($event)"
        (roleChange)="onRoleChange($event)"
      ></app-user-table>
    </mat-card-content>
  </mat-card>
</div>
