<div class="employee-management">
  <div class="page-header">
    <div>
      <h1>Employee Management</h1>
      <p class="subtitle">Manage organization employees</p>
    </div>
    <!-- Removed Add Employee button - HR views/edits employees, Admin creates users -->
  </div>

  <div class="filters-section">
    <mat-card>
      <mat-card-content>
        <div class="filters">
          <mat-form-field appearance="fill" class="search-field">
            <mat-label>Search by name, email, or employee ID</mat-label>
            <input matInput 
                   [ngModel]="searchQuery()" 
                   (ngModelChange)="searchQuery.set($event)">
            <mat-icon matPrefix>search</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Status</mat-label>
            <mat-select [ngModel]="selectedStatus()" (ngModelChange)="selectedStatus.set($event)">
              <mat-option value="all">All</mat-option>
              <mat-option value="active">Active</mat-option>
              <mat-option value="inactive">Inactive</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card class="employees-table-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>people</mat-icon>
        Employees ({{ filteredEmployeesData().length }})
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-user-table
        [columns]="tableColumns"
        [dataSource]="filteredEmployeesData()"
        [loading]="loading()"
        [emptyMessage]="'No employees found. Try adjusting your search or filters.'"
        (view)="onViewEmployee($event)"
        (edit)="onEditEmployee($event)"
      ></app-user-table>
    </mat-card-content>
  </mat-card>
</div>
