<div class="stats-card" [attr.data-color]="data.color || 'primary'">
  <div class="stats-card__icon">
    <mat-icon>{{ data.icon }}</mat-icon>
  </div>
  
  <div class="stats-card__content">
    <div class="stats-card__title">{{ data.title }}</div>
    <div class="stats-card__value">{{ data.value }}</div>
    
    @if (data.subtitle) {
      <div class="stats-card__subtitle">{{ data.subtitle }}</div>
    }
    
    @if (data.trend) {
      <div class="stats-card__trend" [class.positive]="data.trend.isPositive" [class.negative]="!data.trend.isPositive">
        <mat-icon>{{ data.trend.isPositive ? 'trending_up' : 'trending_down' }}</mat-icon>
        <span>{{ data.trend.value }}%</span>
      </div>
    }
  </div>
</div>
